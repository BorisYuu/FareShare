<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FareShare</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FareShare">
<!-- 狀態列用實色（跟 App 背景同色）。透明狀態列在新版 iOS 會讓主畫面 App 的高度少算一段，下方被切掉 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1520" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* ============ 設定：部署 Apps Script 之後，把網頁應用程式網址貼在下面 ============ */
  /* 網址在 index.html 最下方的 WEB_APP_URL */
  :root{--paper:#EAF0F3;--card:#fff;--ink:#15233B;--muted:#66768A;--line:#D8E1E8;--teal:#0B7A84;--red:#D23F48;
    --num:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang TC",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--paper:#0D1520;--card:#162130;--ink:#E6EDF4;--muted:#8FA0B4;--line:#273548;--teal:#3BB4BE;--red:#F06A72}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang TC",system-ui,sans-serif}
  body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}
  html{background:var(--paper)}
  #probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--paper);visibility:hidden}
  #frame.on{visibility:visible}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;
    padding-top:calc(env(safe-area-inset-top) + 24px);padding-bottom:calc(env(safe-area-inset-bottom) + 24px);transition:opacity .3s,visibility 0s .3s}
  .screen.off{opacity:0;visibility:hidden}
  .box{width:100%;max-width:360px}
  .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 0 18px;box-shadow:0 10px 30px -14px rgba(11,122,132,.8)}
  h1{font-family:var(--num);font-size:30px;margin:0 0 6px;letter-spacing:.3px}
  p{color:var(--muted);line-height:1.55;margin:0 0 22px;font-size:15px}
  input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;padding:0 15px;outline:none}
  input:focus{border-color:var(--teal)}
  button{width:100%;height:52px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-size:17px;font-weight:700;margin-top:14px}
  button:active{transform:scale(.98)}
  .err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
  .small{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.55}
  #splash .logo{margin:0 auto 16px}
  .dots{display:flex;gap:6px;justify-content:center}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:b 1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}
  #splashMsg{font-size:13px;color:var(--muted);margin-top:16px;text-align:center;min-height:18px}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
</style>
</head>
<body>
<div id="probe"></div>

<div class="screen off" id="login">
  <div class="box">
    <img class="logo" src="apple-touch-icon.png" alt="">
    <h1>FareShare</h1>
    <p>旅行分帳。輸入朋友給你的旅程密碼就能加入；換手機的話，輸入你的個人通行碼。</p>
    <form id="form" autocomplete="on">
      <input id="key" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="旅程密碼或通行碼" enterkeyhint="go">
      <div class="err" id="err"></div>
      <button type="submit">進入</button>
    </form>
    <div class="small">在 Safari 按分享 → 加入主畫面，之後就像 App 一樣全螢幕使用。</div>
  </div>
</div>

<div class="screen off" id="splash">
  <div class="box" style="text-align:center">
    <img class="logo" src="apple-touch-icon.png" alt="">
    <div class="dots"><i></i><i></i><i></i></div>
    <div id="splashMsg"></div>
  </div>
</div>

<iframe id="frame" title="FareShare" allow="clipboard-write; web-share"></iframe>

<script>
/* ===== 部署 Apps Script 網頁應用程式後，把網址（/exec 結尾）貼在這裡 ===== */
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwuQzuzZH-C06-GYJUycRiOcd5ZFeD9K7-ODnexuL3tI_XS3DjXxWHQI5sxQsQhM1ShiA/exec';

var KEY_NAME = 'fareshare_key';
var $ = function (id) { return document.getElementById(id); };
var key = '';
try { key = localStorage.getItem(KEY_NAME) || ''; } catch (e) {}
var loaded = false, slowTimer = null;

// iPhone 各機型的安全區域（直向，單位 pt）。iOS 偶爾在剛打開時回報 0，這時用這張表補上下方的留白
// key = 螢幕長邊的高度
var DEVICE_INSETS = {
  667: [20, 0],   // SE 2/3、6/7/8
  736: [20, 0],   // 6/7/8 Plus
  780: [50, 34],  // 12 mini、13 mini
  812: [44, 34],  // X、XS、11 Pro
  844: [47, 34],  // 12、13、14、16e
  852: [59, 34],  // 14 Pro、15、15 Pro、16
  874: [62, 34],  // 16 Pro、17 Pro
  896: [48, 34],  // XR、11、XS Max、11 Pro Max
  926: [47, 34],  // 12/13 Pro Max、14 Plus
  932: [59, 34],  // 14 Pro Max、15 Plus、15 Pro Max、16 Plus
  956: [62, 34]   // 16 Pro Max、17 Pro Max
};
function standalone() { return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function measure() {
  var cs = getComputedStyle($('probe'));
  var n = function (v) { return Math.round(parseFloat(v) || 0); };
  return { t: n(cs.paddingTop), b: n(cs.paddingBottom), l: n(cs.paddingLeft), r: n(cs.paddingRight) };
}
function insets() {
  var s = measure();
  if (standalone() && s.t === 0 && s.b === 0 && window.innerHeight > window.innerWidth) {
    var f = DEVICE_INSETS[Math.max(window.screen.width, window.screen.height)];
    if (f) { s.t = 0; s.b = f[1]; s.fallback = true; }   // 狀態列是實色，App 從狀態列下方開始，只需要補下方的 Home 指示條
  }
  return s;
}
// 等 iOS 把安全區域算好再量（最多等 0.6 秒）
function whenInsetsReady(cb) {
  var tries = 0;
  (function poll() {
    var s = measure();
    if (s.t > 0 || s.b > 0 || ++tries > 12) return cb(insets());
    setTimeout(poll, 50);
  })();
}
var appWin = null, appOrigin = '*', lastInsets = '';
function sendInsets() {
  var s = insets(), k = JSON.stringify(s);
  if (k === lastInsets || !appWin) return;
  lastInsets = k;
  appWin.postMessage({ type: 'fs-insets', top: s.t, bottom: s.b, left: s.l, right: s.r }, appOrigin);
}
window.addEventListener('resize', function () { setTimeout(sendInsets, 250); });
window.addEventListener('orientationchange', function () { setTimeout(sendInsets, 400); });

// 鍵盤收起後，把被 iOS 往上推的畫面捲回原位
function resetScroll() {
  if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) {
    window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', function () {
    if (visualViewport.height > window.innerHeight * 0.85) { setTimeout(resetScroll, 60); setTimeout(resetScroll, 350); }
  });
}
window.addEventListener('scroll', function () {
  if (!window.visualViewport || visualViewport.height > window.innerHeight * 0.85) resetScroll();
});
function showScreen(id) {
  ['login', 'splash'].forEach(function (s) { $(s).classList.toggle('off', s !== id); });
  $('frame').classList.toggle('on', id === 'app');
}
function save(k) { key = k; try { if (k) localStorage.setItem(KEY_NAME, k); else localStorage.removeItem(KEY_NAME); } catch (e) {} }

function start() {
  if (!key) { showScreen('login'); setTimeout(function () { $('key').focus(); }, 300); return; }
  if (/請貼上/.test(WEB_APP_URL)) { showScreen('login'); $('err').textContent = '還沒設定 WEB_APP_URL：請在 GitHub 的 index.html 貼上 Apps Script 網址。'; return; }
  showScreen('splash'); $('splashMsg').textContent = '';
  loaded = false;
  clearTimeout(slowTimer);
  slowTimer = setTimeout(function () { if (!loaded) $('splashMsg').textContent = '連線比較慢，還在載入…'; }, 6000);
  setTimeout(function () { if (!loaded) $('splashMsg').textContent = '載入很久了。可以關掉 App 再打開，或檢查網路。'; }, 25000);
  whenInsetsReady(function (s) {
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    var su = location.origin + location.pathname;
    lastInsets = JSON.stringify(s);
    $('frame').src = WEB_APP_URL + '?sat=' + s.t + '&sab=' + s.b + '&sal=' + s.l + '&sar=' + s.r + '&theme=' + (dark ? 'dark' : 'light') + '&su=' + encodeURIComponent(su);
  });
}

function trusted(origin) { return /\.googleusercontent\.com$/.test(origin) || /^https:\/\/script\.google\.com$/.test(origin); }

window.addEventListener('message', function (e) {
  if (!trusted(e.origin)) return;
  var d = e.data || {};
  switch (d.type) {
    case 'fs-ready':                       // App 載入完成，把密碼交給它（密碼不放在網址裡）
      appWin = e.source; appOrigin = e.origin;
      if (e.source && key) e.source.postMessage({ type: 'fs-auth', key: key }, e.origin);
      lastInsets = ''; sendInsets();       // 再確認一次安全區域（iOS 有時載入後才更新）
      break;
    case 'fs-blur': setTimeout(resetScroll, 80); setTimeout(resetScroll, 400); break;
    case 'fs-loaded': loaded = true; clearTimeout(slowTimer); showScreen('app'); break;
    case 'fs-store': if (d.key) save(String(d.key)); break;           // 換成個人通行碼保存
    case 'fs-authfail':
      save(''); $('frame').src = 'about:blank'; showScreen('login');
      $('err').textContent = d.message || '密碼不正確'; $('key').value = '';
      break;
    case 'fs-logout': save(''); $('frame').src = 'about:blank'; $('err').textContent = ''; $('key').value = ''; showScreen('login'); break;
    case 'fs-share':
      if (navigator.share) navigator.share({ text: d.text }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(d.text);
      break;
    case 'fs-copy': if (navigator.clipboard) navigator.clipboard.writeText(d.text).catch(function () {}); break;
  }
});

$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var k = $('key').value.trim();
  if (!k) return;
  $('err').textContent = '';
  $('key').blur();
  save(k); start();
});

window.addEventListener('pageshow', function (e) { if (e.persisted && key) start(); });
start();
</script>
</body>
</html>
